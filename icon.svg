<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#18243c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="micBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Track Waves (Mic Agent - Cyan) -->
  <rect x="116" y="210" width="16" height="60" rx="8" fill="#38bdf8" opacity="0.85"/>
  <rect x="88" y="225" width="16" height="30" rx="8" fill="#38bdf8" opacity="0.5"/>

  <!-- Right Track Waves (Caller System Audio - Purple) -->
  <rect x="380" y="210" width="16" height="60" rx="8" fill="#a855f7" opacity="0.85"/>
  <rect x="408" y="225" width="16" height="30" rx="8" fill="#a855f7" opacity="0.5"/>

  <!-- Microphone Capsule -->
  <rect x="216" y="130" width="80" height="144" rx="40" fill="url(#micBody)"/>
  <!-- Capsule Grill Accents -->
  <line x1="228" y1="180" x2="284" y2="180" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  <line x1="232" y1="200" x2="280" y2="200" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>

  <!-- Microphone Cradle Arc -->
  <path d="M 168 230 A 88 88 0 0 0 344 230" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>

  <!-- Microphone Stand Stem & Base -->
  <line x1="256" y1="318" x2="256" y2="384" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
  <line x1="196" y1="384" x2="316" y2="384" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>

  <!-- Recording Status Indicator -->
  <circle cx="410" cy="102" r="18" fill="#ef4444"/>
  <circle cx="410" cy="102" r="28" fill="none" stroke="#ef4444" stroke-width="5" stroke-opacity="0.4"/>
</svg>